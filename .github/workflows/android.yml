name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Get LTW
        run: |
          sudo apt-get update && sudo apt-get install -y wget
          mkdir -p app_pojavlauncher/libs
          cd app_pojavlauncher/libs
          wget https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar || true

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x scripts/*.sh || true

      - name: Run language list updater
        run: ./scripts/languagelist_updater.sh || true

      - name: Build Debug APK
        run: ./gradlew :app_pojavlauncher:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonPlayz-APK
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
 

