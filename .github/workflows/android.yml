name: Android CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        run: chmod +x gradlew scripts/*.sh

      - name: Run language list updater
        run: ./scripts/languagelist_updater.sh

      - name: Build Debug APK
        run: ./gradlew :app_pojavlauncher:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DragonPlayz-APK
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk

