name: Build PojavLauncher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove Duplicate Resource
        run: |
          rm -f app_pojavlauncher/src/main/res/drawable/ic_pojav_full.webp || true

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x scripts/*.sh || true

      - name: Update Language List
        run: ./scripts/languagelist_updater.sh || true

      - name: Build APK with Gradle
        run: ./gradlew :app_pojavlauncher:assembleDebug --stacktrace --continue

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DragonPlayz-APK
          path: app_pojavlauncher/build/outputs/apk/debug/*.apk
